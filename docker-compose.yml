# Node 20 dev shell with repo bind-mounted at /app (Docker Desktop on Windows works with `.:/app`).
#
# LocalStack: **`npm run deploy:local`** (Windows) runs CDK inside `node20` against **`http://localstack:4566`**
# on the Compose network so S3 virtual-hosted bucket DNS (`*.host…`) does not break asset publish.
# Start before deploy: `docker compose up -d localstack` (or rely on the deploy script, which runs this).
#
# MailHog: optional SMTP sink + web UI for local email testing (see user-guide.md).
# Start with: docker compose up -d mailhog  → UI http://localhost:8025  SMTP localhost:1025
services:
  localstack:
    image: localstack/localstack:4.12
    ports:
      - "${LOCALSTACK_HOST_PORT:-4566}:4566"
    environment:
      DEBUG: ${LOCALSTACK_DEBUG:-0}
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  node20:
    build:
      context: .
      dockerfile: Dockerfile
    image: invoice-processing-node20:local
    working_dir: /app
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    extra_hosts:
      # Route LocalStack's wildcard-friendly hostname to the host.
      # CDK asset publishing uses virtual-hosted bucket subdomains, so we need DNS that can resolve
      # `cdk-hnb...assets-....s3.localhost.localstack.cloud` from inside the container.
      #
      # NOTE: On Docker Desktop (Windows), `host-gateway` may not be honored; use the resolved
      # `host.docker.internal` IP instead.
      - "localhost.localstack.cloud:192.168.65.254"
      - "s3.localhost.localstack.cloud:192.168.65.254"
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CDK_DEFAULT_ACCOUNT: ${CDK_DEFAULT_ACCOUNT:-}
      CDK_DEFAULT_REGION: ${CDK_DEFAULT_REGION:-us-east-1}

volumes:
  localstack_data:
